# Docker Compose template (2026)
# Usage:
#   cp .env.example .env
#   docker compose --profile dev up -d

name: ${COMPOSE_PROJECT_NAME:-myapp}

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - app
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  reverse-proxy:
    <<: *service-defaults
    image: caddy:2.10
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  app:
    <<: *service-defaults
    image: ${APP_IMAGE:-ghcr.io/example/app}:${APP_TAG:-latest}
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8080}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-app}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: cache
      REDIS_PORT: 6379
    expose:
      - "${APP_PORT:-8080}"
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${APP_PORT:-8080}/health || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 20s
    tmpfs:
      - /tmp:size=64m

  worker:
    <<: *service-defaults
    image: ${APP_IMAGE:-ghcr.io/example/app}:${APP_TAG:-latest}
    command: ["./bin/worker"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-app}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: cache
      REDIS_PORT: 6379
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    profiles: ["worker"]

  db:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  cache:
    <<: *service-defaults
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  adminer:
    <<: *service-defaults
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["dev"]

networks:
  app:
    driver: bridge

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:-./ops/secrets/db_password.txt}
